<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" id="theme-color" content="#fbf5eb">
    <title>LostLink — Thapar campus lost &amp; found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" data-page="dashboard" aria-label="LostLink dashboard">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7.5 14.5 16 7l8.5 7.5v10a1.5 1.5 0 0 1-1.5 1.5H9a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M12.5 26v-8h7v8M22 8.5l2.5 2.2"/></svg></span>
          <span class="brand-name">Lost<span>Link</span><small>THAPAR COMMUNITY</small></span>
        </a>
        <div class="nav-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg></span>Dashboard</button>
          <button class="nav-item" data-page="browse"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5M8 11h5.5M10.8 8v6"/></svg></span>Browse items<span class="nav-count" id="nav-item-count">0</span></button>
          <div class="nav-label nav-label-spaced">YOUR ACTIVITY</div>
          <button class="nav-item" data-page="report-lost"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></span>Report lost</button>
          <button class="nav-item" data-page="report-found"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 13.5h4l2.2 3h3.6l2.2-3h4"/><path d="M5 8.5h14l2 5v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/><path d="M8 8.5 10 4h4l2 4.5"/></svg></span>Report found</button>
          <button class="nav-item" data-page="reports"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v5h5M9 13h6M9 17h6"/></svg></span>My reports</button>
          <button class="nav-item" data-page="claims"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8.5 11.5 12 15l7-7"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></span>Claims &amp; requests<span class="nav-count" id="nav-claim-count">0</span></button>
          <div class="nav-label nav-label-spaced">ACCOUNT</div>
          <button class="nav-item" data-page="profile"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span>My profile</button>
          <button class="nav-item" data-page="settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.3 1-1.3 2.3-1.6-.6a7.5 7.5 0 0 1-1.6.9l-.3 1.7h-2.7l-.3-1.7a7.5 7.5 0 0 1-1.6-.9l-1.6.6-1.3-2.3 1.3-1a7 7 0 0 1 0-1.9l-1.3-1 1.3-2.3 1.6.6a7.5 7.5 0 0 1 1.6-.9l.3-1.7h2.7l.3 1.7a7.5 7.5 0 0 1 1.6.9l1.6-.6 1.3 2.3-1.3 1a7 7 0 0 1-.1 1.8Z"/></svg></span>Settings</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="campus-card"><span class="campus-icon"><svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6v10H3z"/><path d="M8 20v-6h8v6M7 10h.01M12 10h.01M17 10h.01"/></svg></span><div><strong>Thapar campus</strong><small>Patiala, Punjab</small></div><span class="online-dot"></span></div>
          <button class="user-mini" data-page="profile"><span class="avatar" id="mini-avatar">N</span><span class="user-mini-info"><strong id="mini-name">Nidhi</strong><small id="mini-email">Student account</small></span><span class="mini-more">···</span></button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="breadcrumb"><span>Thapar community</span><b>/</b><strong id="crumb-current">Dashboard</strong></div>
          <div class="topbar-actions">
            <button class="icon-button theme-toggle" id="theme-toggle" aria-label="Toggle color theme"><svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
            <button class="top-profile" data-page="profile"><span class="avatar avatar-small" id="top-avatar">N</span><span id="top-name">Nidhi</span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button>
          </div>
        </header>
        <div class="page-content" id="page-content"></div>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
    <script src="app.js"></script>
  </body>
</html>
